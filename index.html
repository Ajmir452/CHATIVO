<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#11142b">
<title>CHATIVO</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#0b0e20;--panel:#151a32;--panel2:#1d2442;--primary:#6c63ff;--text:#fff;--muted:#9ba3c7;--border:rgba(255,255,255,.08)}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}button,input,textarea{font:inherit}button{cursor:pointer;border:0}.hidden{display:none!important}
.app{width:100%;max-width:600px;min-height:100vh;margin:auto;background:var(--bg);position:relative;padding-bottom:85px}.app-header{display:flex;align-items:center;justify-content:space-between;padding:18px 16px;background:var(--panel);border-bottom:1px solid var(--border)}.logo{font-size:24px;font-weight:bold;color:var(--primary);letter-spacing:1px}.header-actions{display:flex;gap:10px}.icon-btn{width:40px;height:40px;border-radius:12px;background:var(--panel2);color:white;font-size:18px}
.section-heading{display:flex;justify-content:space-between;align-items:center;padding:16px}.section-heading h3{font-size:15px}.muted{color:var(--muted);font-size:12px}
.stories-list{display:flex;gap:14px;overflow-x:auto;padding:4px 16px 16px}.story-item{min-width:68px;text-align:center;cursor:pointer}.story-avatar{width:62px;height:62px;border-radius:50%;padding:3px;border:2px solid var(--primary);object-fit:cover}.story-item p{font-size:11px;margin-top:6px;color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.chats-section{padding-bottom:20px}.chat-item,.friend-item{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--border)}.chat-item{cursor:pointer}.avatar{width:48px;height:48px;border-radius:50%;object-fit:cover;background:var(--panel2)}.chat-item-info{flex:1;min-width:0}.chat-item-info h4{font-size:14px;margin-bottom:5px}.chat-item-info p{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:600px;display:flex;justify-content:space-around;background:var(--panel);padding:12px 5px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--border);z-index:20}.nav-btn{background:transparent;color:var(--muted);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:5px}.nav-btn.active{color:var(--primary)}.nav-btn span{font-size:20px}
.auth-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:22px}.auth-box{width:100%;max-width:400px;background:var(--panel);padding:25px;border-radius:20px;border:1px solid var(--border)}.auth-box h2{text-align:center;margin-bottom:8px}.subtitle{text-align:center;color:var(--muted);font-size:13px;margin-bottom:24px}.auth-box input{width:100%;padding:14px;margin-bottom:13px;border-radius:10px;background:var(--bg);border:1px solid var(--border);color:white;outline:none}
.primary-btn,.secondary-btn{width:100%;padding:14px;border-radius:10px;color:white;font-weight:bold}.primary-btn{background:var(--primary)}.secondary-btn{padding:12px;margin-top:10px;background:var(--panel2)}
.chat-window{display:none;position:fixed;inset:0;z-index:30;background:var(--bg);flex-direction:column;max-width:600px;margin:auto}.chat-window.show{display:flex}.chat-header{display:flex;align-items:center;gap:12px;padding:12px;background:var(--panel);border-bottom:1px solid var(--border)}.chat-user-info{flex:1}.chat-user-info h3{font-size:15px}.messages-list{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:12px}.message-row{display:flex;width:100%}.message-row.mine{justify-content:flex-end}.bubble{max-width:78%;padding:11px 14px;border-radius:15px;background:var(--panel2);overflow-wrap:anywhere;font-size:14px;white-space:pre-wrap}.message-row.mine .bubble{background:var(--primary)}.message-form{display:flex;gap:8px;padding:12px;background:var(--panel)}.message-form input{flex:1;min-width:0;padding:13px;border-radius:12px;background:var(--bg);color:white;border:1px solid var(--border);outline:none}.send-btn{width:48px;border-radius:12px;background:var(--primary);color:white;font-size:20px}
.modal{display:none;position:fixed;inset:0;z-index:50;background:#000b;align-items:center;justify-content:center;padding:16px}.modal.open{display:flex}.modal-content{width:100%;max-width:420px;max-height:85vh;overflow-y:auto;padding:20px;border-radius:18px;background:var(--panel)}.modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.modal-header button,.story-viewer-header button{background:transparent;color:white;font-size:22px}.modal-content input,.modal-content textarea{width:100%;padding:12px;margin:8px 0 14px;background:var(--bg);border:1px solid var(--border);color:white;border-radius:10px;outline:none}.modal-content label{font-size:13px;color:var(--muted)}
.profile-photo-area{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:18px}.profile-photo{width:100px;height:100px;border-radius:50%;object-fit:cover;background:var(--panel2)}
.story-viewer{display:none;position:fixed;inset:0;z-index:60;background:#080914;padding:15px;flex-direction:column}.story-viewer.show{display:flex}.story-viewer-header{display:flex;justify-content:space-between;align-items:center}.story-owner-info{display:flex;align-items:center;gap:10px}#storyViewerContent{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden}#storyViewerContent img,#storyViewerContent video{max-width:100%;max-height:70vh;object-fit:contain}#storyViewerCaption{text-align:center;padding:10px}.story-reactions{display:flex;justify-content:space-around;padding:12px 0}.story-reactions button{background:var(--panel2);border-radius:50%;width:42px;height:42px;font-size:19px}
#toast{display:none;position:fixed;bottom:85px;left:50%;transform:translateX(-50%);z-index:100;background:var(--panel2);color:white;padding:12px 18px;border-radius:10px;max-width:90%;text-align:center}#toast.show{display:block}.friend-item button{padding:9px 12px;border-radius:8px;background:var(--primary);color:white}
@media(max-width:380px){.logo{font-size:21px}}
</style>
</head>
<body>
<div id="authScreen" class="auth-screen"><div class="auth-box">
<h2 class="logo">CHATIVO</h2><p class="subtitle">Connect with your friends</p>
<div id="loginForm"><input id="loginEmail" type="email" placeholder="Email address" autocomplete="email"><input id="loginPassword" type="password" placeholder="Password" autocomplete="current-password"><button class="primary-btn" onclick="loginUser()">Login</button><button class="secondary-btn" onclick="showRegister()">Create Account</button></div>
<div id="registerForm" class="hidden"><input id="registerName" type="text" placeholder="Full name"><input id="registerEmail" type="email" placeholder="Email address"><input id="registerPassword" type="password" placeholder="Password (at least 6 characters)"><button class="primary-btn" onclick="registerUser()">Register</button><button class="secondary-btn" onclick="showLogin()">Back to Login</button></div>
</div></div>
<div id="mainApp" class="app hidden">
<header class="app-header"><div class="logo">CHATIVO</div><div class="header-actions"><button class="icon-btn" onclick="openFriendSearch()">🔎</button><button class="icon-btn" onclick="openProfile()">👤</button></div></header>
<div id="storiesHeading" class="section-heading"><h3>STORIES</h3><button class="icon-btn" onclick="openStoryComposer()">＋</button></div><div id="storiesList" class="stories-list"></div>
<div id="chatsHeading" class="section-heading"><h3>RECENT CHATS</h3><span class="muted">Messages</span></div><div id="chatsList" class="chats-section"></div>
<div id="friendsSection" class="hidden"><div class="section-heading"><h3>MY FRIENDS</h3><button class="icon-btn" onclick="openFriendSearch()">＋</button></div><div id="friendsList"></div><div class="section-heading"><h3>FRIEND REQUESTS</h3></div><div id="friendRequestsList"></div></div>
<nav class="bottom-nav"><button class="nav-btn active" onclick="showTab('chats',this)"><span>💬</span>Chats</button><button class="nav-btn" onclick="showTab('friends',this)"><span>👥</span>Friends</button><button class="nav-btn" onclick="showTab('stories',this)"><span>⭕</span>Stories</button></nav>
</div>
<div id="chatWindow" class="chat-window"><div class="chat-header"><button class="icon-btn" onclick="closeChat()">←</button><img id="chatUserAvatar" class="avatar" src="https://placehold.co/100" alt="Profile"><div class="chat-user-info"><h3 id="chatUserName">User</h3><p class="muted">CHATIVO</p></div></div><div id="messagesList" class="messages-list"></div><form class="message-form" onsubmit="sendMessage(event)"><input id="messageInput" type="text" placeholder="Write a message..." autocomplete="off" required><button type="submit" class="send-btn">➤</button></form></div>
<div id="friendSearchModal" class="modal"><div class="modal-content"><div class="modal-header"><h3>Find Friends</h3><button onclick="closeFriendSearch()">✕</button></div><input id="friendSearchInput" type="text" placeholder="Search by name..." oninput="searchFriends()"><div id="friendSearchResults"></div></div></div>
<div id="storyComposerModal" class="modal"><div class="modal-content"><div class="modal-header"><h3>Create Story</h3><button onclick="closeStoryComposer()">✕</button></div><input id="storyFileInput" type="file" accept="image/*,video/*" onchange="previewStory(event)"><div id="storyPreviewContainer"></div><textarea id="storyCaption" placeholder="Write a caption..." rows="3"></textarea><button class="primary-btn" onclick="uploadStory()">Share Story</button></div></div>
<div id="storyViewer" class="story-viewer"><div class="story-viewer-header"><div class="story-owner-info"><img id="storyOwnerAvatar" class="avatar" src="https://placehold.co/100" alt="Story owner"><span id="storyOwnerName">User</span></div><button onclick="closeStoryViewer()">✕</button></div><div id="storyViewerContent"></div><div id="storyViewerCaption"></div><div id="storyReactions" class="story-reactions"><button onclick="reactToStory('👍')">👍</button><button onclick="reactToStory('❤️')">❤️</button><button onclick="reactToStory('🥰')">🥰</button><button onclick="reactToStory('😭')">😭</button><button onclick="reactToStory('🤬')">🤬</button></div></div>
<div id="toast"></div>
<div id="profileModal" class="modal"><div class="modal-content"><div class="modal-header"><h3>My Profile</h3><button onclick="closeProfile()">✕</button></div><div class="profile-photo-area"><img id="profilePhotoPreview" class="profile-photo" src="https://placehold.co/150" alt="Profile photo"><input id="profilePhotoInput" type="file" accept="image/*" onchange="previewProfilePhoto(event)"><button class="secondary-btn" onclick="uploadProfilePhoto()">Upload Photo</button></div><label for="profileName">Display Name</label><input id="profileName" type="text" placeholder="Your name"><label for="profileBio">Bio</label><textarea id="profileBio" rows="3" placeholder="Write something about yourself..."></textarea><button class="primary-btn" onclick="saveProfile()">Save Profile</button><button class="secondary-btn" onclick="logoutUser()">Logout</button></div></div>
<script>
'use strict';
// Supabase client: use the project's publishable/anon key only. Never put service_role keys in browser code.
const SUPABASE_URL = 'https://wmtbcwcaxlmznffyrtsy.supabase.co';
const SUPABASE_KEY = 'sb_publishable_sUsu1vTb9ORMyut4qKzHxg_LfPMMoUc';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentUser = null, currentProfile = null;
let activeConversationId = null, activeChatUser = null, activeStory = null;
let selectedStoryFile = null, selectedProfilePhoto = null, messageChannel = null;
let toastTimer = null;

function $(id){return document.getElementById(id)}
function showToast(message){const t=$('toast');t.textContent=String(message||'Something went wrong');t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),3200)}
function showLogin(){$('loginForm').classList.remove('hidden');$('registerForm').classList.add('hidden')}
function showRegister(){$('loginForm').classList.add('hidden');$('registerForm').classList.remove('hidden')}
function setSignedInUI(signedIn){$('authScreen').classList.toggle('hidden',signedIn);$('mainApp').classList.toggle('hidden',!signedIn)}
async function loginUser(){const email=$('loginEmail').value.trim(),password=$('loginPassword').value;if(!email||!password){showToast('Enter email and password');return}try{const {data,error}=await supabaseClient.auth.signInWithPassword({email,password});if(error)throw error;currentUser=data.user;await startApp()}catch(e){showToast(e.message)}}
async function registerUser(){const name=$('registerName').value.trim(),email=$('registerEmail').value.trim(),password=$('registerPassword').value;if(!name||!email||password.length<6){showToast('Enter your name, email and a password of at least 6 characters');return}try{const {data,error}=await supabaseClient.auth.signUp({email,password,options:{data:{display_name:name}}});if(error)throw error;if(data.session){currentUser=data.user;await startApp()}else{showToast('Account created. Check your email to confirm, then log in.');showLogin()}}catch(e){showToast(e.message)}}
async function logoutUser(){try{const {error}=await supabaseClient.auth.signOut();if(error)throw error;currentUser=null;currentProfile=null;setSignedInUI(false);showLogin()}catch(e){showToast(e.message)}}
async function startApp(){try{const {data,error}=await supabaseClient.auth.getSession();if(error)throw error;currentUser=data.session?.user||currentUser;if(!currentUser){setSignedInUI(false);return}setSignedInUI(true);await loadProfile();await Promise.all([loadChats(),loadFriends(),loadFriendRequests(),loadStories()]);showTab('chats',document.querySelector('.nav-btn'))}catch(e){console.error(e);showToast(e.message)}}
async function loadProfile(){if(!currentUser)return;let {data,error}=await supabaseClient.from('profiles').select('*').eq('id',currentUser.id).maybeSingle();if(error)throw error;if(!data){const displayName=currentUser.user_metadata?.display_name||currentUser.email?.split('@')[0]||'User';const result=await supabaseClient.from('profiles').insert({id:currentUser.id,display_name:displayName,bio:''}).select().single();if(result.error)throw result.error;data=result.data}currentProfile=data}
async function saveProfile(){if(!currentUser)return;const display_name=$('profileName').value.trim(),bio=$('profileBio').value.trim();if(!display_name){showToast('Display name is required');return}try{const {data,error}=await supabaseClient.from('profiles').update({display_name,bio}).eq('id',currentUser.id).select().single();if(error)throw error;currentProfile=data;closeProfile();await Promise.all([loadChats(),loadFriends(),loadStories()]);showToast('Profile saved')}catch(e){showToast(e.message)}}
function openProfile(){$('profileName').value=currentProfile?.display_name||'';$('profileBio').value=currentProfile?.bio||'';$('profilePhotoPreview').src=currentProfile?.avatar_url||'https://placehold.co/150';$('profileModal').classList.add('open')}
function closeProfile(){$('profileModal').classList.remove('open')}
function showTab(tab,button){document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));if(button)button.classList.add('active');const friends=tab==='friends';$('friendsSection').classList.toggle('hidden',!friends);$('chatsHeading').classList.toggle('hidden',friends||tab==='stories');$('chatsList').classList.toggle('hidden',friends||tab==='stories');$('storiesHeading').classList.toggle('hidden',tab==='friends');$('storiesList').classList.toggle('hidden',tab==='friends');if(friends){loadFriends();loadFriendRequests()}if(tab==='stories')loadStories()}
async function loadChats(){if(!currentUser)return;const list=$('chatsList');list.innerHTML='';try{const {data:members,error}=await supabaseClient.from('conversation_members').select('conversation_id').eq('user_id',currentUser.id);if(error)throw error;for(const m of members||[]){const {data:others,error:oe}=await supabaseClient.from('conversation_members').select('user_id').eq('conversation_id',m.conversation_id).neq('user_id',currentUser.id);if(oe)throw oe;if(!others?.length)continue;const friendId=others[0].user_id;const {data:p}=await supabaseClient.from('profiles').select('id,display_name,avatar_url').eq('id',friendId).maybeSingle();const {data:last}=await supabaseClient.from('messages').select('content').eq('conversation_id',m.conversation_id).order('created_at',{ascending:false}).limit(1);const item=document.createElement('div');item.className='chat-item';const avatar=document.createElement('img');avatar.className='avatar';avatar.src=p?.avatar_url||'https://placehold.co/100';const info=document.createElement('div');info.className='chat-item-info';const h=document.createElement('h4');h.textContent=p?.display_name||'User';const msg=document.createElement('p');msg.textContent=last?.[0]?.content||'Start a conversation';info.append(h,msg);item.append(avatar,info);item.onclick=()=>openChat(m.conversation_id,p||{id:friendId,display_name:'User'});list.append(item)}if(!members?.length)list.innerHTML='<p class="muted" style="padding:16px">No chats yet. Add a friend to start messaging.</p>'}catch(e){console.error(e);showToast(e.message)}}
async function openChat(conversationId,profile){activeConversationId=conversationId;activeChatUser=profile;$('chatUserName').textContent=profile?.display_name||'User';$('chatUserAvatar').src=profile?.avatar_url||'https://placehold.co/100';$('messagesList').innerHTML='';$('chatWindow').classList.add('show');await loadMessages();if(messageChannel)await supabaseClient.removeChannel(messageChannel);messageChannel=supabaseClient.channel('messages-'+conversationId).on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:'conversation_id=eq.'+conversationId},payload=>{if(activeConversationId===conversationId)addMessage(payload.new)}).subscribe()}
async function loadMessages(){if(!activeConversationId)return;const {data,error}=await supabaseClient.from('messages').select('*').eq('conversation_id',activeConversationId).order('created_at',{ascending:true});if(error){showToast(error.message);return}$('messagesList').innerHTML='';(data||[]).forEach(addMessage)}
function addMessage(message){if(!message||!$('messagesList'))return;if($('messagesList').querySelector('[data-message-id="'+message.id+'"]'))return;const row=document.createElement('div');row.className='message-row'+(message.sender_id===currentUser?.id?' mine':'');if(message.id!==undefined)row.dataset.messageId=message.id;const bubble=document.createElement('div');bubble.className='bubble';bubble.textContent=message.content||'';row.append(bubble);$('messagesList').append(row);$('messagesList').scrollTop=$('messagesList').scrollHeight}
async function sendMessage(event){event.preventDefault();if(!currentUser||!activeConversationId)return;const input=$('messageInput'),content=input.value.trim();if(!content)return;input.value='';const {error}=await supabaseClient.from('messages').insert({conversation_id:activeConversationId,sender_id:currentUser.id,content});if(error){input.value=content;showToast(error.message)}}
function closeChat(){if(messageChannel){supabaseClient.removeChannel(messageChannel);messageChannel=null}activeConversationId=null;activeChatUser=null;$('chatWindow').classList.remove('show')}
function openFriendSearch(){$('friendSearchModal').classList.add('open');$('friendSearchInput').value='';$('friendSearchResults').innerHTML=''}
function closeFriendSearch(){$('friendSearchModal').classList.remove('open')}
async function searchFriends(){if(!currentUser)return;const q=$('friendSearchInput').value.trim(),results=$('friendSearchResults');if(q.length<2){results.innerHTML='';return}try{const {data,error}=await supabaseClient.from('profiles').select('id,display_name,avatar_url').ilike('display_name','%'+q+'%').neq('id',currentUser.id).limit(20);if(error)throw error;results.innerHTML='';for(const p of data||[]){const item=document.createElement('div');item.className='friend-item';const img=document.createElement('img');img.className='avatar';img.src=p.avatar_url||'https://placehold.co/100';const name=document.createElement('span');name.textContent=p.display_name||'User';name.style.flex='1';const btn=document.createElement('button');btn.textContent='Add Friend';btn.onclick=()=>sendFriendRequest(p.id);item.append(img,name,btn);results.append(item)}if(!data?.length)results.textContent='No users found'}catch(e){showToast(e.message)}}
async function sendFriendRequest(receiverId){try{const {data,error:checkError}=await supabaseClient.from('friend_requests').select('id,status').or('and(sender_id.eq.'+currentUser.id+',receiver_id.eq.'+receiverId+'),and(sender_id.eq.'+receiverId+',receiver_id.eq.'+currentUser.id+')');if(checkError)throw checkError;if(data?.length){showToast('Friend request already exists');return}const {error}=await supabaseClient.from('friend_requests').insert({sender_id:currentUser.id,receiver_id:receiverId,status:'pending'});if(error)throw error;showToast('Friend request sent')}catch(e){showToast(e.message)}}
async function loadFriendRequests(){if(!currentUser)return;const list=$('friendRequestsList');try{const {data,error}=await supabaseClient.from('friend_requests').select('*').eq('receiver_id',currentUser.id).eq('status','pending');if(error)throw error;list.innerHTML='';for(const req of data||[]){const {data:p}=await supabaseClient.from('profiles').select('display_name,avatar_url').eq('id',req.sender_id).maybeSingle();if(!p)continue;const item=document.createElement('div');item.className='friend-item';const name=document.createElement('span');name.textContent=p.display_name||'User';name.style.flex='1';const btn=document.createElement('button');btn.textContent='Accept';btn.onclick=()=>acceptFriendRequest(req.id);item.append(name,btn);list.append(item)}if(!data?.length)list.innerHTML='<p class="muted" style="padding:12px">No friend requests</p>'}catch(e){showToast(e.message)}}
async function acceptFriendRequest(id){try{const {error}=await supabaseClient.from('friend_requests').update({status:'accepted'}).eq('id',id).eq('receiver_id',currentUser.id);if(error)throw error;showToast('Friend request accepted');await Promise.all([loadFriendRequests(),loadFriends()])}catch(e){showToast(e.message)}}
async function loadFriends(){if(!currentUser)return;const list=$('friendsList');try{const {data,error}=await supabaseClient.from('friend_requests').select('*').eq('status','accepted').or('sender_id.eq.'+currentUser.id+',receiver_id.eq.'+currentUser.id);if(error)throw error;list.innerHTML='';for(const req of data||[]){const id=req.sender_id===currentUser.id?req.receiver_id:req.sender_id;const {data:p}=await supabaseClient.from('profiles').select('id,display_name,avatar_url').eq('id',id).maybeSingle();if(!p)continue;const item=document.createElement('div');item.className='friend-item';const img=document.createElement('img');img.className='avatar';img.src=p.avatar_url||'https://placehold.co/100';const name=document.createElement('span');name.textContent=p.display_name||'User';name.style.flex='1';const btn=document.createElement('button');btn.textContent='Message';btn.onclick=()=>openFriendChat(p);item.append(img,name,btn);list.append(item)}if(!data?.length)list.innerHTML='<p class="muted" style="padding:12px">No friends yet</p>'}catch(e){showToast(e.message)}}
async function openFriendChat(profile){try{const {data:mine,error}=await supabaseClient.from('conversation_members').select('conversation_id').eq('user_id',currentUser.id);if(error)throw error;let id=null;for(const m of mine||[]){const {data:other,error:oe}=await supabaseClient.from('conversation_members').select('user_id').eq('conversation_id',m.conversation_id).eq('user_id',profile.id);if(oe)throw oe;if(other?.length){id=m.conversation_id;break}}if(!id){const {data:c,error:ce}=await supabaseClient.from('conversations').insert({}).select().single();if(ce)throw ce;id=c.id;const {error:me}=await supabaseClient.from('conversation_members').insert([{conversation_id:id,user_id:currentUser.id},{conversation_id:id,user_id:profile.id}]);if(me)throw me}closeFriendSearch();await openChat(id,profile);await loadChats()}catch(e){showToast(e.message)}}
function openStoryComposer(){$('storyComposerModal').classList.add('open')}
function closeStoryComposer(){$('storyComposerModal').classList.remove('open')}
function previewStory(event){const file=event.target.files?.[0];if(!file)return;if(!file.type.startsWith('image/')&&!file.type.startsWith('video/')){showToast('Choose an image or video');return}if(file.size>50*1024*1024){showToast('Maximum file size is 50 MB');event.target.value='';return}selectedStoryFile=file;const box=$('storyPreviewContainer');box.innerHTML='';const media=document.createElement(file.type.startsWith('video/')?'video':'img');media.src=URL.createObjectURL(file);media.style.maxWidth='100%';media.style.maxHeight='250px';media.style.borderRadius='12px';if(media.tagName==='VIDEO')media.controls=true;box.append(media)}
async function uploadStory(){if(!currentUser||!selectedStoryFile){showToast('Select a story first');return}try{const file=selectedStoryFile,ext=(file.name.split('.').pop()||'jpg').toLowerCase(),path=currentUser.id+'/'+Date.now()+'.'+ext;const {error:up}=await supabaseClient.storage.from('stories').upload(path,file,{cacheControl:'3600',upsert:false,contentType:file.type});if(up)throw up;const expires=new Date(Date.now()+86400000).toISOString();const {error:ins}=await supabaseClient.from('stories').insert({user_id:currentUser.id,media_path:path,caption:$('storyCaption').value.trim(),expires_at:expires});if(ins)throw ins;selectedStoryFile=null;$('storyFileInput').value='';$('storyCaption').value='';$('storyPreviewContainer').innerHTML='';closeStoryComposer();await loadStories();showToast('Story uploaded successfully')}catch(e){showToast(e.message)}}
async function loadStories(){if(!currentUser)return;const list=$('storiesList');try{const {data,error}=await supabaseClient.from('stories').select('*').gt('expires_at',new Date().toISOString()).order('created_at',{ascending:false});if(error)throw error;list.innerHTML='';for(const story of data||[]){const {data:p}=await supabaseClient.from('profiles').select('id,display_name,avatar_url').eq('id',story.user_id).maybeSingle();const item=document.createElement('div');item.className='story-item';const img=document.createElement('img');img.className='story-avatar';img.src=p?.avatar_url||'https://placehold.co/100';const name=document.createElement('p');name.textContent=p?.display_name||'User';item.append(img,name);item.onclick=()=>openStory(story,p);list.append(item)}}catch(e){console.error(e);showToast(e.message)}}
async function openStory(story,profile){activeStory=story;$('storyOwnerName').textContent=profile?.display_name||'User';$('storyOwnerAvatar').src=profile?.avatar_url||'https://placehold.co/100';$('storyViewerCaption').textContent=story.caption||'';const box=$('storyViewerContent');box.innerHTML='';const {data}=supabaseClient.storage.from('stories').getPublicUrl(story.media_path);const media=document.createElement(/\.(mp4|webm|ogg|mov)$/i.test(story.media_path)?'video':'img');media.src=data.publicUrl;media.style.maxWidth='100%';media.style.maxHeight='70vh';if(media.tagName==='VIDEO'){media.controls=true;media.autoplay=true}box.append(media);$('storyViewer').classList.add('show');if(story.user_id!==currentUser.id){const {error}=await supabaseClient.from('story_views').upsert({story_id:story.id,viewer_id:currentUser.id},{onConflict:'story_id,viewer_id'});if(error)console.warn(error.message)}}
function closeStoryViewer(){const v=$('storyViewerContent').querySelector('video');if(v){v.pause();v.removeAttribute('src');v.load()}$('storyViewerContent').innerHTML='';$('storyViewer').classList.remove('show');activeStory=null}
async function reactToStory(reaction){if(!currentUser||!activeStory)return;const allowed=['👍','❤️','🥰','😭','🤬'];if(!allowed.includes(reaction))return;try{const {error}=await supabaseClient.from('story_reactions').upsert({story_id:activeStory.id,user_id:currentUser.id,reaction},{onConflict:'story_id,user_id'});if(error)throw error;showToast('Reaction saved')}catch(e){showToast(e.message)}}
function previewProfilePhoto(event){const file=event.target.files?.[0];if(!file)return;if(!file.type.startsWith('image/')){showToast('Choose an image');return}if(file.size>5*1024*1024){showToast('Maximum photo size is 5 MB');event.target.value='';return}selectedProfilePhoto=file;$('profilePhotoPreview').src=URL.createObjectURL(file)}
async function uploadProfilePhoto(){if(!currentUser||!selectedProfilePhoto){showToast('Select a profile photo first');return}try{const file=selectedProfilePhoto,ext=(file.name.split('.').pop()||'jpg').toLowerCase(),path=currentUser.id+'/'+Date.now()+'.'+ext;const {error:up}=await supabaseClient.storage.from('avatars').upload(path,file,{cacheControl:'3600',upsert:false,contentType:file.type});if(up)throw up;const {data:pub}=supabaseClient.storage.from('avatars').getPublicUrl(path);const {data,error}=await supabaseClient.from('profiles').update({avatar_url:pub.publicUrl}).eq('id',currentUser.id).select().single();if(error)throw error;currentProfile=data;selectedProfilePhoto=null;$('profilePhotoInput').value='';await Promise.all([loadChats(),loadFriends(),loadStories()]);showToast('Profile photo updated')}catch(e){showToast(e.message)}}
supabaseClient.auth.onAuthStateChange((event)=>{if(event==='SIGNED_OUT'){currentUser=null;currentProfile=null;activeConversationId=null;activeChatUser=null;setSignedInUI(false)}});
document.addEventListener('DOMContentLoaded',startApp);
</script>
</body>
</html>
